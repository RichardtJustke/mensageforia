services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped # volta sozinho após reboot/crash da máquina
    ports:
      - "11435:11434" # 11435 no host pra não brigar com o Ollama local (11434)
    volumes:
      - ollama_models:/root/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  app:
    build: .
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-RichardtJustke}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-richardtjustke@users.noreply.github.com}
      - TZ=${TZ:-America/Sao_Paulo}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - MSG_WINDOW_START=${MSG_WINDOW_START:-08:00}
      - MSG_WINDOW_END=${MSG_WINDOW_END:-20:00}
    volumes:
      # pasta de dados (SQLite) e pasta das mensagens geradas
      - ./data:/app/data
      - ./messages:/app/messages
    depends_on:
      ollama:
        condition: service_healthy # só sobe quando o ollama responde

volumes:
  ollama_models:
