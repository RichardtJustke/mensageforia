services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama/models

  app:
    build: .
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - TZ=America/Sao_Paulo
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./.db:/app/.db: persisted
      - ./messages:/app/messages: persisted
    depends_on:
      - ollama

volumes:
  ollama_models: